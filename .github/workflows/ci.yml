name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing combination should not cancel the others: when a platform
      # disagrees, the useful question is which ones.
      fail-fast: false
      matrix:
        # Windows earns its place here: SystemZoneName reads the zone from the
        # registry and translates it through CLDR, and that file is compiled on
        # no other platform.
        #
        # What it cannot tell us: the runner has Go installed, so zones resolve
        # from $GOROOT/lib/time/zoneinfo.zip whether or not tzdata_windows.go
        # embedded a copy. A green Windows job says the registry path works, not
        # that a shipped binary finds its zones.
        os: [ubuntu-latest, windows-latest]
        go-version: ["1.22", "1.23", "stable"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -count=1
